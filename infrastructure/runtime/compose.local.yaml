services:
  certificates:
    build: {context: ../.., dockerfile: infrastructure/operations/Dockerfile}
    image: maizedoctor-operations:local
    user: root
    entrypoint: [python, /operations/certificates.py]
    volumes: [certificates:/certificates]
    network_mode: none
    restart: "no"

  postgres:
    image: pgvector/pgvector:0.8.7-pg18-bookworm
    environment:
      POSTGRES_DB: maizedoctor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets: [postgres_password]
    volumes: [postgres_data:/var/lib/postgresql, certificates:/certificates:ro]
    command: [postgres, -c, ssl=on, -c, ssl_cert_file=/certificates/server.crt, -c, ssl_key_file=/certificates/server.key, -c, log_min_error_statement=panic, -c, log_parameter_max_length_on_error=0]
    networks: [data]
    depends_on: {certificates: {condition: service_completed_successfully}}
    healthcheck:
      test: [CMD, pg_isready, -U, postgres, -d, maizedoctor]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 768m

  initialize:
    image: maizedoctor-operations:local
    command: [provision-local, --local, --secrets, /run/secrets/operator_config]
    secrets: [operator_config]
    volumes: [certificates:/certificates:ro]
    networks: [data]
    depends_on: {postgres: {condition: service_healthy}}
    restart: "no"

  migrate:
    volumes: [certificates:/certificates:ro]
    depends_on: {initialize: {condition: service_completed_successfully}}

  grants:
    image: maizedoctor-operations:local
    command: [grant-local, --local, --secrets, /run/secrets/operator_config]
    secrets: !override [operator_config]
    volumes: [certificates:/certificates:ro]
    networks: [data]
    depends_on: {migrate: {condition: service_completed_successfully}}
    restart: "no"

  curate:
    image: ${AI_IMAGE:-maizedoctor-ai:local}
    entrypoint: [python, -m, app.rag.cli]
    command: [ingest, --corpus, /knowledge/maize-extension-20261012-v1.json, --review, /knowledge/maize-extension-20261012-v1.review.json]
    environment:
      ENVIRONMENT: production
      INFERENCE_ENABLED: "false"
      RAG_ENABLED: "true"
      GENERATION_ENABLED: "false"
      HOST: 0.0.0.0
      MAIZEDOCTOR_SECRETS_FILE: /run/secrets/curator_config
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      EMBEDDING_VERSION: ${EMBEDDING_VERSION}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
    secrets: [curator_config]
    volumes: ["../../backend/knowledge:/knowledge:ro", certificates:/certificates:ro]
    networks: [data, ai_egress]
    depends_on: {grants: {condition: service_completed_successfully}}
    restart: "no"

  ai:
    depends_on: {curate: {condition: service_completed_successfully}}

  api:
    depends_on: {grants: {condition: service_completed_successfully}}

  edge:
    ports: !override ["127.0.0.1:8080:80", "127.0.0.1:8443:443"]
    volumes:
      - ./tls-local.caddy:/etc/caddy/tls.caddy:ro

volumes:
  postgres_data: {}

secrets:
  postgres_password: {file: "${SECRETS_DIRECTORY}/postgres-password"}
  operator_config: {file: "${SECRETS_DIRECTORY}/operator.json"}
  curator_config: {file: "${SECRETS_DIRECTORY}/curator.json"}
