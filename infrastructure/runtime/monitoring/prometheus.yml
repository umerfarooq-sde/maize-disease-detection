global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers:
    - static_configs: [{targets: [alertmanager:9093]}]
scrape_configs:
  - job_name: node
    metrics_path: /internal/metrics
    http_headers:
      X-Operations-Token: {files: [/run/secrets/operations_token]}
    # One time series per replica; a single DNS-balanced target hides instances.
    dns_sd_configs:
      - names: [api]
        type: A
        port: 3000
        refresh_interval: 30s
  - job_name: ai
    metrics_path: /internal/metrics
    authorization: {credentials_file: /run/secrets/operations_token}
    static_configs: [{targets: [ai:8000]}]
  - job_name: cleanup
    metrics_path: /internal/metrics
    http_headers:
      X-Operations-Token: {files: [/run/secrets/operations_token]}
    static_configs: [{targets: [cleanup:9010]}]
  - job_name: backups
    metrics_path: /internal/metrics
    authorization: {credentials_file: /run/secrets/operations_token}
    static_configs: [{targets: [backups:9031]}]
  - job_name: alerts
    metrics_path: /internal/metrics
    authorization: {credentials_file: /run/secrets/operations_token}
    static_configs: [{targets: [alerts:9030]}]
