name: maizedoctor
description: "MAIZEDOCTOR farmer app foundation, MVVM and reusable design system."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  go_router: ^17.5.0
  http: ^1.6.0
  http_parser: ^4.1.2
  image_picker: 1.2.2
  provider: ^6.1.5
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  default-flavor: staging
  uses-material-design: true
  assets:
    - assets/fonts/plus_jakarta_sans/OFL.txt
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Variable.ttf
          weight: 400
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Variable.ttf
          weight: 500
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Variable.ttf
          weight: 600
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Variable.ttf
          weight: 700
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Italic-Variable.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Italic-Variable.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Italic-Variable.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Italic-Variable.ttf
          weight: 700
          style: italic
