[project]
name = "maizedoctor-preprocessing"
version = "1.0.0"
description = "One deterministic lesion-preserving preprocessing pipeline for training and serving"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=2.4.2,<3",
    "pydantic>=2.13,<3",
    "pillow>=12.1.0,<13",
    "opencv-python==4.13.0.92; sys_platform == 'win32'",
    "opencv-python-headless==4.13.0.92; sys_platform != 'win32'",
]

[project.scripts]
maizedoctor-preprocess = "maizedoctor_preprocessing.debug:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true
