[project]
name = "maizedoctor-ai-service"
version = "0.1.0"
description = "FastAPI and inference development dependencies; no service implementation yet"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.128.5,<1",
    "uvicorn>=0.47.0,<1",
    "numpy>=2.4.2,<3",
    "opencv-python==4.13.0.92; sys_platform == 'win32'",
    "opencv-python-headless==4.13.0.92; sys_platform != 'win32'",
    "pillow>=12.1.0,<13",
    "torch==2.10.0",
    "torchvision==0.25.0",
]

[dependency-groups]
dev = ["httpx>=0.28.1,<1", "pytest>=8.4,<10"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
