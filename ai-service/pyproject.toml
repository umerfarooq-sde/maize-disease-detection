[project]
name = "maizedoctor-ai-service"
version = "0.1.0"
description = "Internal FastAPI AI service foundation for MAIZEDOCTOR"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.128.5,<1",
    "uvicorn>=0.47.0,<1",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.12,<3",
    "numpy>=2.4.2,<3",
    "opencv-python==4.13.0.92; sys_platform == 'win32'",
    "opencv-python-headless==4.13.0.92; sys_platform != 'win32'",
    "pillow>=12.1.0,<13",
    "torch==2.10.0",
    "torchvision==0.25.0",
]

[dependency-groups]
dev = ["httpx>=0.28.1,<1", "pytest>=8.4,<10", "ruff>=0.15,<1", "mypy>=1.19,<2"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true
