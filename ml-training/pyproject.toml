[project]
name = "maizedoctor-ml-training"
version = "0.1.0"
description = "Reproducible maize disease training and evaluation with shared preprocessing"
requires-python = ">=3.11,<3.12"
dependencies = [
    "maizedoctor-preprocessing==1.0.0",
    "matplotlib>=3.10,<4",
    "numpy>=2.4.2,<3",
    "opencv-python==4.13.0.92; sys_platform == 'win32'",
    "opencv-python-headless==4.13.0.92; sys_platform != 'win32'",
    "pillow>=12.1.0,<13",
    "python-dotenv>=1.2.4,<2",
    "scikit-learn==1.8.0",
    "scipy==1.17.1",
    "torch==2.10.0",
    "torchvision==0.25.0",
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.15,<1", "mypy>=1.19,<2"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
maizedoctor-preprocessing = { path = "../shared/preprocessing", editable = true }
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["preprocessing.py", "configuration.py", "dataset_inventory.py", "dataset_review.py", "dataset_preparation.py", "evaluation.py", "model.py", "training_data.py", "train.py"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true
