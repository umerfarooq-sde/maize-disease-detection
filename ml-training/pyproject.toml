[project]
name = "maizedoctor-ml-training"
version = "0.1.0"
description = "ML experiment development dependencies; no training pipeline yet"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=2.4.2,<3",
    "opencv-python==4.13.0.92; sys_platform == 'win32'",
    "opencv-python-headless==4.13.0.92; sys_platform != 'win32'",
    "pillow>=12.1.0,<13",
    "scikit-learn==1.8.0",
    "scipy==1.17.1",
    "torch==2.10.0",
    "torchvision==0.25.0",
]

[dependency-groups]
dev = ["pytest>=8.4,<10"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
